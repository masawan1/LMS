<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobsheet GitHub Website - PDF Reader</title>
  <style>
    :root {
      --warna-utama: #1f4e79;
      --warna-latar: #f2f2f2;
      --warna-teks: #222222;
      --font-utama: Calibri, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-utama);
      background-color: var(--warna-latar);
      color: var(--warna-teks);
      line-height: 1.6;
    }

    header {
      background-color: var(--warna-utama);
      color: #ffffff;
      text-align: center;
      padding: 30px 20px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tombol {
      display: inline-block;
      background-color: var(--warna-utama);
      color: #ffffff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .tombol:hover {
      opacity: 0.85;
    }

    .tombol-luar {
      background-color: #ffffff;
      color: var(--warna-utama);
      border: 1px solid var(--warna-utama);
    }

    .pembungkus-pdf {
      background-color: #ffffff;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .tampilan-pdf {
      width: 100%;
      height: 80vh;
      border: none;
      border-radius: 6px;
    }

    .catatan {
      text-align: center;
      font-size: 13px;
      color: #666666;
      margin-top: 12px;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 13px;
      color: #666666;
    }
  </style>
</head>
